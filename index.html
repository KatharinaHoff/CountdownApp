<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            background: linear-gradient(135deg, #fdf6ff 0%, #ede9fe 50%, #dbeafe 100%);
            color: #1e1b4b;
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 24px;
            padding: 3em 4em;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(139, 92, 246, 0.12);
            max-width: 600px;
        }

        .label {
            font-size: 0.8em;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #7c3aed;
            margin-bottom: 0.6em;
        }

        #days {
            font-size: 2.6em;
            font-weight: 900;
            line-height: 1.2;
            color: #1e1b4b;
            margin-bottom: 0.4em;
        }

        #days .working-days {
            display: block;
            font-size: 0.45em;
            font-weight: 400;
            color: #64748b;
            margin-top: 0.3em;
        }

        #message {
            font-size: 1em;
            color: #4c1d95;
            margin-top: 1em;
            line-height: 1.6;
            max-width: 420px;
            min-height: 3.2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .footer {
            margin-top: 2.5em;
            font-size: 0.65em;
            color: #a78bfa;
            letter-spacing: 0.05em;
        }

        .buttons {
            display: flex;
            gap: 1em;
            margin-top: 2em;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Nunito', sans-serif;
            font-size: 0.9em;
            font-weight: 700;
            padding: 0.65em 1.4em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #btn-positive {
            background: #7c3aed;
            color: #fff;
        }

        #btn-negative {
            background: #f1f5f9;
            color: #1e1b4b;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        #image-area {
            margin-top: 1.8em;
        }

        #image-area img {
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(139, 92, 246, 0.18);
        }

        #image-status {
            font-size: 0.85em;
            color: #7c3aed;
            margin-top: 0.5em;
            min-height: 1.2em;
        }

        .buttons { display: none; }
        .buttons.visible { display: flex; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40%            { transform: translateY(-6px); opacity: 1; }
        }

        .dots {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            height: 1em;
        }

        .dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #a78bfa;
            animation: bounce 1.2s ease-in-out infinite;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        #image-placeholder {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: #e5e7eb;
            border-radius: 16px;
            margin: 0 auto;
        }

        #token-notice {
            margin-top: 2em;
            font-size: 0.85em;
            color: #7c3aed;
            line-height: 1.6;
        }

        #token-notice a {
            color: #7c3aed;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="label" id="countdown-label">Freedom countdown</div>
        <div id="days"></div>
        <div id="message"></div>
        <div class="buttons" id="buttons">
            <button id="btn-positive">✨ Generate a positive image</button>
            <button id="btn-negative">💥 Generate a negative image</button>
        </div>
        <div id="token-notice"></div>
        <div id="image-area">
            <div id="image-placeholder"></div>
            <div id="image-status"></div>
        </div>
        <div class="footer">hang in there ✦</div>
    </div>

    <script src="config.js"></script>
    <script src="data/traits.js"></script>
    <script src="data/prompts.js"></script>
    <script>
        const scenarioLabels = {
            "teaching-end-teacher": "End of teaching period",
            "teaching-end-student": "End of semester",
            "grant-deadline":       "Grant deadline countdown",
            "thesis-submission":    "Thesis submission countdown",
            "thesis-defense":       "Thesis defense countdown",
            "contract-end-boss":    "Contract end countdown",
            "contract-end-employee": "Last day under this boss",
        };
        document.getElementById("countdown-label").textContent =
            scenarioLabels[scenario] ?? "Freedom countdown";

        // Fetch holidays dynamically (Germany, MV)
        async function fetchHolidays(year) {
            try {
                const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/DE`);
                const data = await response.json();

                // Filter for Mecklenburg-Vorpommern (MV)
                return data
                    .filter(h => !h.counties || h.counties.includes("DE-MV"))
                    .map(h => new Date(h.date).toDateString());
            } catch (e) {
                console.error("Holiday fetch failed, fallback to none.");
                return [];
            }
        }

        function isWorkingDay(date, holidays) {
            const day = date.getDay();
            const isWeekend = (day === 0 || day === 6);
            const isHoliday = holidays.includes(date.toDateString());
            return !isWeekend && !isHoliday;
        }

        function countWorkingDays(start, end, holidays) {
            let count = 0;
            let current = new Date(start);

            while (current <= end) {
                if (isWorkingDay(current, holidays)) count++;
                current.setDate(current.getDate() + 1);
            }
            return count;
        }

        function getDaysLeft() {
            const today = new Date();
            const diff = targetDate - today;
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function getTrait(daysLeft) {
            return traits[Math.abs(daysLeft) % traits.length];
        }

        async function fetchLLMTrait() {
            try {
                const res = await fetch(`/api/trait?scenario=${encodeURIComponent(scenario)}`);
                if (!res.ok) return null;
                const data = await res.json();
                return data.trait ?? null;
            } catch {
                return null;
            }
        }

        async function init() {
            const today = new Date();
            const year = today.getFullYear();

            const holidays = await fetchHolidays(year);

            const daysLeft = getDaysLeft();
            const workingDays = countWorkingDays(today, targetDate, holidays);

            const daysEl = document.getElementById("days");
            const messageEl = document.getElementById("message");

            if (daysLeft > 0) {
                daysEl.innerHTML = `
                    ${daysLeft} days until it's over.
                    <span class="working-days">(${workingDays} working days)</span>
                `;

                // Show loading placeholder, then replace with LLM trait (or static fallback)
                messageEl.innerHTML = `<span class="dots"><span></span><span></span><span></span></span>`;
                fetchLLMTrait().then(trait => {
                    const text = trait ?? getTrait(daysLeft);
                    messageEl.textContent = `After this, you will no longer have trouble with ${text}.`;
                });
            } else if (daysLeft === 0) {
                daysEl.textContent = "Today is the day.";
                messageEl.textContent = "It's finally over.";
            } else {
                daysEl.textContent = "It's already over.";
                messageEl.textContent = "You made it.";
            }
        }

        init();

        async function checkToken() {
            try {
                const res = await fetch("/api/status");
                const { tokenReady } = await res.json();
                if (tokenReady) {
                    document.getElementById("buttons").classList.add("visible");
                    generateInitialImage();
                } else {
                    document.getElementById("image-placeholder").style.display = "none";
                    document.getElementById("token-notice").innerHTML =
                        `To enable image generation, add your API token to <code>.env</code>.<br>
                        See <a href="README.md" target="_blank">README.md</a> - Steps 2 and 4.`;
                }
            } catch {
                document.getElementById("image-placeholder").style.display = "none";
                document.getElementById("token-notice").innerHTML =
                    `Image buttons are unavailable because the server is not running.<br>
                    Open a terminal in the project folder and run <code>npm start</code>,<br>
                    then open <a href="http://localhost:3000">http://localhost:3000</a> in your browser.<br>
                    See <a href="README.md" target="_blank">README.md</a> for full setup instructions.`;
            }
        }

        async function generateInitialImage() {
            const statusEl = document.getElementById("image-status");
            const imageArea = document.getElementById("image-area");
            const placeholder = document.getElementById("image-placeholder");
            const buttons = document.querySelectorAll("button");

            buttons.forEach(b => b.disabled = true);
            statusEl.innerHTML = `<span class="dots"><span></span><span></span><span></span></span>`;

            try {
                const promptRes = await fetch(`/api/initial-prompt?scenario=${encodeURIComponent(scenario)}`);
                if (!promptRes.ok) throw new Error("Prompt generation failed");
                const { prompt } = await promptRes.json();

                const imageRes = await fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt }),
                });
                const data = await imageRes.json();
                if (data.error) throw new Error(data.error);

                const img = document.createElement("img");
                img.src = `data:image/png;base64,${data.image}`;
                img.alt = prompt;
                placeholder.replaceWith(img);
                imageArea.insertBefore(img, statusEl);
                statusEl.textContent = "";
            } catch {
                placeholder.style.display = "none";
                statusEl.textContent = "";
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }

        checkToken();

        async function generateImage(prompts) {
            const prompt = prompts[Math.floor(Math.random() * prompts.length)];
            const statusEl = document.getElementById("image-status");
            const imageArea = document.getElementById("image-area");
            const messageEl = document.getElementById("message");
            const buttons = document.querySelectorAll("button");

            buttons.forEach(b => b.disabled = true);
            statusEl.textContent = "Generating…";

            messageEl.innerHTML = `<span class="dots"><span></span><span></span><span></span></span>`;
            fetchLLMTrait().then(trait => {
                const daysLeft = getDaysLeft();
                const text = trait ?? getTrait(daysLeft);
                messageEl.textContent = `After this, you will no longer have trouble with ${text}.`;
            });

            try {
                const res = await fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt }),
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error);

                const existing = imageArea.querySelector("img");
                if (existing) existing.remove();

                const img = document.createElement("img");
                img.src = `data:image/png;base64,${data.image}`;
                img.alt = prompt;
                imageArea.insertBefore(img, statusEl);
                statusEl.textContent = "";
            } catch (err) {
                statusEl.textContent = "Generation failed. Is the server running?";
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }

        const fallbackScenario = "teaching-end-teacher";
        document.getElementById("btn-positive").addEventListener("click", () => generateImage(positivePrompts[scenario] ?? positivePrompts[fallbackScenario]));
        document.getElementById("btn-negative").addEventListener("click", () => generateImage(negativePrompts[scenario] ?? negativePrompts[fallbackScenario]));
    </script>
</body>
</html>
